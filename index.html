<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ARME — Travel Collection</title>
<style>
:root{font-family:Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#1b1b19;background:#fff;scroll-behavior:smooth}
*{box-sizing:border-box}body{margin:0}a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid #4561ad;outline-offset:5px}
.wrap{width:min(1192px,calc(100% - 56px));margin:auto}.nav{border-bottom:1px solid #ecece9}.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:18px}.logo{font-weight:900;letter-spacing:.15em;font-size:22px}.links{display:flex;gap:24px;font-size:13px}.label{font-size:11px;font-weight:700;letter-spacing:.18em}.intro{padding:57px 0 25px;display:flex;justify-content:space-between;align-items:end;gap:20px}.intro h1{font-size:clamp(47px,8vw,104px);line-height:.92;letter-spacing:-.08em;margin:0}.intro p{font-size:15px;color:#555650;margin:0 0 3px;text-align:right}
.hero{display:grid;grid-template-columns:1fr 1.03fr;background:#edede8;border-radius:24px;overflow:hidden;min-height:470px}.hero-copy{padding:clamp(27px,5vw,72px);align-self:center}.hero h2{font-size:clamp(43px,6.6vw,96px);letter-spacing:-.075em;line-height:.87;margin:20px 0}.hero p{font-size:18px;line-height:1.55;margin:0 0 24px}.hero img{width:100%;height:100%;object-fit:cover;display:block;aspect-ratio:1.15}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:15px;font-size:13px}.pill{display:inline-flex;align-items:center;min-height:44px;padding:0 17px;background:#20211f;color:#fff;border-radius:30px}.quiet:hover{text-decoration:underline}
.lineup{padding:90px 0 75px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:27px}.section-head h2{font-size:clamp(32px,5vw,60px);margin:8px 0 0;letter-spacing:-.07em}.section-head a{font-size:13px;flex-shrink:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid #eaeae6;border-radius:18px;overflow:hidden}.card img{width:100%;aspect-ratio:1.14;object-fit:cover;display:block;background:#eeeee9}.card-copy{padding:24px}.card h3{font-size:clamp(23px,2.7vw,37px);letter-spacing:-.06em;margin:0 0 10px}.card p{font-size:14px;line-height:1.55;margin:0 0 18px;color:#555650}
.end{background:#1d1e1c;color:#fff;padding:49px 0}.end .wrap{display:flex;justify-content:space-between;align-items:center;gap:18px}.end p{margin:0;font-size:12px;color:#d7d7d1}.end a{font-size:13px}
@media(max-width:720px){.wrap{width:calc(100% - 32px)}.nav .wrap{height:55px}.links{gap:14px}.intro{padding-top:35px;display:block}.intro p{text-align:left;margin:12px 0 0}.hero{grid-template-columns:1fr;min-height:0;border-radius:18px}.hero-copy{padding:28px 22px 22px}.hero h2{margin:12px 0}.hero p{font-size:15px;margin-bottom:15px}.hero img{aspect-ratio:1.34;height:auto}.lineup{padding:55px 0 43px}.grid{grid-template-columns:1fr}.card img{aspect-ratio:1.4}.end .wrap{flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){:root{scroll-behavior:auto}}
.details{padding:0 0 76px}.details figure{margin:0;border-radius:18px;overflow:hidden;background:#f3f4f6}.details img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.details figcaption{padding:18px 20px;font-size:15px;font-weight:700}.hero img{object-position:center 57%}

.pill,.photo-button,.close-preview,.tab{font:inherit;cursor:pointer;border:0}.pill{font-size:13px;transition:background .2s,transform .2s}.pill:hover{background:#414340}.pill:active{transform:scale(.97)}button:focus-visible{outline:2px solid #4561ad;outline-offset:3px}.photo-button{padding:0;width:100%;overflow:hidden;display:block;background:#eeeee9}.card img{transition:transform .45s cubic-bezier(.2,.65,.25,1)}@media(hover:hover){.card:hover img,.card:focus-within img{transform:scale(1.045)}}
dialog{width:min(920px,calc(100% - 24px));max-height:calc(100dvh - 32px);padding:0;border:0;border-radius:23px;color:inherit;background:#fff;overscroll-behavior:contain}dialog::backdrop{background:#17191c88;backdrop-filter:blur(8px)}dialog[open]{animation:appear .28s ease-out}body:has(dialog[open]){overflow:hidden}@keyframes appear{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}.modal-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px clamp(18px,4vw,42px);position:sticky;top:0;background:#fffffff5;z-index:1;border-bottom:1px solid #ececea}.close-preview{border-radius:50%;width:42px;height:42px;font-size:24px;background:#eee;color:#222}.modal-body{padding:clamp(19px,4vw,42px);display:grid;grid-template-columns:1.15fr 1fr;gap:26px}.modal-body img{width:100%;aspect-ratio:1.07;object-fit:cover;border-radius:15px}.modal-body h2{font-size:clamp(32px,5vw,52px);letter-spacing:-.07em;margin:10px 0}.modal-body p{line-height:1.6}.tab-row{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 14px}.tab{border-radius:22px;background:#f1f1f1;padding:10px 14px}.tab[aria-pressed=true]{background:#20211f;color:white}.payment-options{display:grid;gap:7px}.payment-options label{display:flex;gap:8px;align-items:center;padding:12px;border:1px solid #dedede;border-radius:10px}.payment-options label:has(input:checked){border-color:#20211f;background:#f5f5f5}.sample{font-size:12px;color:#565656}@media(max-width:650px){.modal-body{grid-template-columns:1fr}.modal-body img{aspect-ratio:1.4}}@media(prefers-reduced-motion:reduce){*,dialog[open]{transition:none!important;animation:none!important}}
.photo-button{position:relative}.photo-button .alternate{position:absolute;inset:0;height:100%;opacity:0;transition:opacity .28s ease,transform .45s cubic-bezier(.2,.65,.25,1)}.photo-button:focus-visible .alternate{opacity:1}@media(hover:hover){.photo-button:hover .alternate{opacity:1}}.gallery{min-width:0}.gallery img{aspect-ratio:4/5;object-fit:contain;background:#f3f3f5;display:block}.gallery-controls{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px}.gallery-controls button{width:44px;height:44px;border:0;border-radius:50%;background:#eee;color:#222;cursor:pointer;font-size:20px}.gallery-controls button:hover{background:#ddd}.photo-count{font-size:13px;font-variant-numeric:tabular-nums}.hero img{object-position:center 63%}
.photo-button[data-model="cabin"] img{object-position:center 68%}
.color-list{display:flex;flex-wrap:wrap;gap:8px}.color-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid #ddd;border-radius:18px;background:#fff;color:#222;font:inherit;font-size:12px}.color-chip::before{content:"";width:11px;height:11px;border-radius:50%;background:var(--swatch);border:1px solid #0002}.color-chip:is(button){cursor:pointer}.color-chip:is(button):hover,.color-chip[aria-pressed=true]{border-color:#222}

.product-banners{display:grid;gap:12px;margin:0 0 76px}
.product-banner{position:relative;isolation:isolate;overflow:hidden;text-align:center;min-height:clamp(580px,60vw,1020px);background:#f0f0f2}
.banner-art{position:absolute;z-index:-1;inset:0;overflow:hidden}
.banner-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;transition:opacity .38s ease,transform .55s ease}
.banner-art .banner-alternate{opacity:0}
.banner-copy{position:relative;padding:44px 16px 0}
.banner-copy h1,.banner-copy h2{font-size:clamp(40px,6vw,80px);line-height:1;letter-spacing:-.06em;margin:0}
.banner-copy p{font-size:clamp(15px,2vw,23px);margin:10px 0 19px}
.banner-open{border:0;background:transparent;padding:0;cursor:pointer;color:inherit;font:inherit}
.banner-open::after{content:"";position:absolute;inset:0;z-index:2}
.banner-copy{position:static}
.banner-open span{display:inline-flex;align-items:center;min-height:44px;padding:0 19px;border-radius:30px;background:#fff;color:#181818;font-size:14px;border:1px solid #16161626;transition:background .2s,color .2s}
.banner-open:focus-visible::after{outline:3px solid #426bd0;outline-offset:-5px}
.banner-cabin{background:#878482;color:#fff}
.banner-cabin .banner-art img{object-fit:cover;object-position:center 65%}
.banner-cabin .banner-art::after{content:"";position:absolute;inset:0;background:linear-gradient(#15151565,transparent 46%)}
.banner-metron .banner-art,.banner-essential .banner-art{top:167px}
.banner-metron .banner-art img,.banner-essential .banner-art img{object-fit:contain}
.banner-essential{background:#e7e6e2}
@media(hover:hover){.product-banner:hover .banner-alternate{opacity:1}.product-banner:hover .banner-open span{background:#222;color:#fff}}
@media(max-width:720px){.product-banners{margin-bottom:50px}.product-banner{min-height:520px}.banner-copy{padding-top:35px}.banner-cabin .banner-art img{object-position:center 61%}.banner-metron .banner-art,.banner-essential .banner-art{top:145px}}

.nav{position:sticky;top:0;z-index:5;background:#fffffff2;backdrop-filter:blur(16px)}
.nav .site-menu{display:flex;align-items:center;justify-content:center;gap:clamp(14px,5vw,68px);height:52px;width:calc(100% - 24px);white-space:nowrap}
.site-menu a{display:inline-flex;align-items:center;min-height:44px;font-size:13px;color:#363635;transition:color .2s}
.site-menu a:hover{color:#000;text-decoration:underline;text-underline-offset:5px}
.site-menu .logo{font-size:17px;color:#181818}
.product-banner[id],.accessories-section{scroll-margin-top:64px}
.accessories-section{padding:clamp(55px,9vw,110px) 20px;text-align:center;background:#f5f5f7}
.accessories-section h2{margin:0;font-size:clamp(32px,5vw,56px);letter-spacing:-.05em}
.accessories-section p{margin:14px 0 0;color:#555}
@media(max-width:400px){.nav .site-menu{gap:12px}.site-menu a{font-size:12px}.site-menu .logo{font-size:15px}}

/* Extend each photograph into the sides of its banner. */
.banner-metron{--edge-photo:url("assets/metron-5814.webp");--hover-edge-photo:url("assets/metron-5798.webp")}
.banner-essential{--edge-photo:url("assets/una05142.webp")}
.banner-metron .banner-art,.banner-essential .banner-art{top:0}
.banner-metron .banner-art::before,.banner-essential .banner-art::before{
  content:"";position:absolute;inset:-28px;
  background:linear-gradient(#f5f5f5c9,#f5f5f52b),var(--edge-photo) center 70% / cover;
  filter:blur(25px);
}
.banner-metron .banner-art img,.banner-essential .banner-art img{
  inset:auto auto 0 50%;width:auto;max-width:100%;height:auto;max-height:calc(100% - 165px);
  transform:translateX(-50%);
  mask-image:linear-gradient(to right,transparent,#000 5%,#000 95%,transparent),linear-gradient(to bottom,transparent,#000 5%);
  mask-composite:intersect;
}
@media(hover:hover){.banner-metron:hover .banner-art::before{background-image:linear-gradient(#f5f5f5c9,#f5f5f52b),var(--hover-edge-photo)}}
@media(max-width:720px){.banner-metron .banner-art img,.banner-essential .banner-art img{max-height:calc(100% - 145px)}}
</style>
</head>
<body id="home">
<header class="nav">
  <nav class="site-menu wrap" aria-label="주 메뉴">
    <a class="logo" href="#home" aria-label="ARME 홈">ARME</a>
    <a href="#essential">Essential</a>
    <a href="#cabin">Cabin</a>
    <a href="#metron">Metron</a>
    <a href="#accessories">악세서리</a>
  </nav>
</header>
<main>
<div class="product-banners" id="lineup">
<section id="cabin" class="product-banner banner-cabin" aria-labelledby="banner-cabin">
  <div class="banner-art">
    <img src="assets/cabin-red-blue.webp" alt="바토리 레드와 글레이셔 블루 메트론 카빈" fetchpriority="high">
    <img class="banner-alternate" src="assets/cabin-light-duo.webp" alt="" loading="lazy">
  </div>
  <div class="banner-copy">
    <h1 id="banner-cabin">METRON CABIN</h1>
    <p>바토리 레드와 글레이셔 블루.</p>
    <button class="banner-open" type="button" data-model="cabin" aria-label="METRON CABIN 자세히 보기"><span>자세히 보기</span></button>
  </div>
</section>
<section id="metron" class="product-banner banner-metron" aria-labelledby="banner-metron">
  <div class="banner-art">
    <img src="assets/metron-5814.webp" alt="글레이셔 블루 메트론 세로형 캐리어" loading="lazy">
    <img class="banner-alternate" src="assets/metron-5798.webp" alt="" loading="lazy">
  </div>
  <div class="banner-copy">
    <h2 id="banner-metron">METRON</h2>
    <p>글레이셔 블루 · 바토리 레드</p>
    <button class="banner-open" type="button" data-model="metron" aria-label="METRON 자세히 보기"><span>자세히 보기</span></button>
  </div>
</section>
<section id="essential" class="product-banner banner-essential" aria-labelledby="banner-essential">
  <div class="banner-art">
    <img src="assets/una05142.webp" alt="에센셜 캐리어 두 사이즈" loading="lazy">
    
  </div>
  <div class="banner-copy">
    <h2 id="banner-essential">ESSENTIAL</h2>
    <p>20 · 24 · 28인치 라인업</p>
    <button class="banner-open" type="button" data-model="essential" aria-label="ESSENTIAL 자세히 보기"><span>자세히 보기</span></button>
  </div>
</section>
</div>
<div class="wrap">
<section class="details" id="details" aria-labelledby="detail-title">
<div class="section-head"><div><span class="label">METRON CABIN</span><h2 id="detail-title">가까이에서 살펴보기.</h2></div></div>
<div class="grid">
<figure><img src="assets/cabin-open.webp" alt="위로 열리는 메트론 카빈과 레드 수납 공간" loading="lazy"><figcaption>위로 열리는 구조</figcaption></figure>
<figure><img src="assets/cabin-lock.webp" alt="메트론 카빈 TSA 잠금장치 확대 사진" loading="lazy"><figcaption>TSA 잠금장치</figcaption></figure>
<figure><img src="assets/cabin-lining.webp" alt="ARME 로고가 새겨진 레드 안감" loading="lazy"><figcaption>레드 안감</figcaption></figure>
</div></section>
</div>
<section id="accessories" class="accessories-section" aria-labelledby="accessories-title">
  <h2 id="accessories-title">악세서리</h2>
  <p>제품 소개 준비 중</p>
</section>
</main>
<footer class="end"><div class="wrap"><strong class="logo">ARME</strong><p>메인 화면 디자인 시안</p></div></footer>
<dialog id="product-preview" aria-labelledby="preview-title">
<header class="modal-top"><span class="label">ARME / PRODUCT PREVIEW</span><button class="close-preview" type="button" aria-label="상세 보기 닫기" autofocus>×</button></header>
<div class="modal-body"><div class="gallery"><img id="preview-image" alt=""><div class="gallery-controls"><button type="button" data-step="-1" aria-label="이전 사진">‹</button><span class="photo-count" aria-live="polite"></span><button type="button" data-step="1" aria-label="다음 사진">›</button></div></div><div>
<span class="label">TRAVEL COLLECTION</span><h2 id="preview-title"></h2>
<div class="tab-row" role="group" aria-label="상세 정보 보기"><button type="button" class="tab" aria-pressed="true" data-panel="overview">제품 소개</button><button type="button" class="tab" aria-pressed="false" data-panel="payment">결제 방식 예시</button></div>
<div id="overview"><p id="preview-description"></p><section id="cabin-colors" hidden aria-label="메트론 카빈 컬러"><h3>컬러</h3><div class="color-list"><button class="color-chip" type="button" data-photo="cabin-silver" style="--swatch:#b6bcc6">Space Silver</button><button class="color-chip" type="button" data-photo="cabin-red" style="--swatch:#c62e3c">Bathory Red</button><button class="color-chip" type="button" data-photo="cabin-red-blue" style="--swatch:#aac7df">Clacier Blue</button><button class="color-chip" type="button" data-photo="cabin-dark-duo" style="--swatch:#575859">Dark Gray</button><button class="color-chip" type="button" data-photo="cabin-black" style="--swatch:#202021">Tripple Black</button><button class="color-chip" type="button" data-photo="una05368" style="--swatch:#f0ede2">Cream White</button><button class="color-chip" type="button" data-photo="una05365" style="--swatch:#e9bfc9">Dawn Pink</button></div></section></div>
<div id="payment" hidden><p class="sample">디자인 시안용 예시입니다. 실제 결제는 진행되지 않습니다.</p><div class="payment-options" role="group" aria-label="결제 방식 예시"><label><input type="radio" name="payment" checked>신용·체크카드</label><label><input type="radio" name="payment">간편결제</label><label><input type="radio" name="payment">계좌이체</label></div></div>
</div></div></dialog>
<script>
const preview = document.querySelector('#product-preview');
const modelDetails = {
  metron: ['METRON', '글레이셔 블루와 바토리 레드. 세로형 메트론을 여러 각도에서 살펴보세요.'],
  cabin: ['METRON CABIN', '가로형 실루엣과 위로 열리는 구조. 실버 외관 안에 레드 수납 공간이 펼쳐집니다.'],
  essential: ['ESSENTIAL', '20·24·28인치로 구성된 에센셜 라인업.']
};
const previewImage = document.querySelector('#preview-image');
const galleries = {"metron":["metron-5814","metron-5798","metron-5770","metron-5791","metron-5771","metron-5792","metron-5767","metron-5793","metron-5769","metron-5795","metron-5764","metron-5790","metron-5810","metron-5818"],"cabin":["cabin-red-blue","cabin-light-duo","cabin-dark-duo","cabin-silver","cabin-black","cabin-red","cabin-front","una08738","una08698","una08692","cabin-open","una05368","una05365","una05287","una05355","una05317","cabin-lock","cabin-lining"],"essential":["una05142","una05159","una05176","una05250","una05267","una05273","una05395"]};
const galleryLabels = {"metron":"메트론","cabin":"메트론 카빈","essential":"에센셜"};
let currentModel = 'cabin';
let currentPhoto = 0;
const cabinColors = document.querySelector('#cabin-colors');
const colorButtons = cabinColors.querySelectorAll('[data-photo]');
for (const button of colorButtons) {
  button.addEventListener('click', () => {
    currentPhoto = galleries.cabin.indexOf(button.dataset.photo);
    showPhoto();
  });
}
function showPhoto() {
  const photos = galleries[currentModel];
  const photo = photos[currentPhoto];
  previewImage.src = 'assets/' + photo + '.webp';
  for (const button of colorButtons) {
    button.setAttribute('aria-pressed', currentModel === 'cabin' && button.dataset.photo === photo);
  }
  previewImage.alt = galleryLabels[currentModel] + ' 촬영 컷 ' + (currentPhoto + 1);
  preview.querySelector('.photo-count').textContent = (currentPhoto + 1) + ' / ' + photos.length;
}
for (const control of preview.querySelectorAll('[data-step]')) {
  control.addEventListener('click', () => {
    const count = galleries[currentModel].length;
    currentPhoto = (currentPhoto + Number(control.dataset.step) + count) % count;
    showPhoto();
  });
}
const tabs = [...preview.querySelectorAll('[data-panel]')];
function showPanel(panel) {
  for (const button of tabs) {
    const active = button.dataset.panel === panel;
    button.setAttribute('aria-pressed', active);
    document.getElementById(button.dataset.panel).hidden = !active;
  }
}
for (const button of tabs) {
  button.addEventListener('click', () => showPanel(button.dataset.panel));
}
for (const button of document.querySelectorAll('[data-model]')) {
  button.addEventListener('click', () => {
    const key = button.dataset.model;
    const [name, description] = modelDetails[key];
    document.querySelector('#preview-title').textContent = name;
    document.querySelector('#preview-description').textContent = description;
    currentModel = key;
    cabinColors.hidden = key !== 'cabin';
    currentPhoto = 0;
    showPhoto();
    preview.querySelector('input[name=payment]').checked = true;
    showPanel('overview');
    preview.showModal();
    preview.scrollTop = 0;
  });
}
preview.querySelector('.close-preview').addEventListener('click', () => preview.close());
preview.addEventListener('click', event => { if (event.target === preview) preview.close(); });
</script>
</body>
</html>
